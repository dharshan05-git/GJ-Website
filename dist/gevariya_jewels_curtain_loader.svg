  <defs>
    <linearGradient id="fabricGradient" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
      <stop offset="0%" stop-color="#C47D8F"/>
      <stop offset="15%" stop-color="#d693a4"/>
      <stop offset="35%" stop-color="#ab6b7b"/>
      <stop offset="50%" stop-color="#C47D8F"/>
      <stop offset="70%" stop-color="#df9dac"/>
      <stop offset="85%" stop-color="#a36373"/>
      <stop offset="100%" stop-color="#C47D8F"/>
    </linearGradient>

    <filter id="curtainShadow" x="-30%" y="0" width="160%" height="100%">
      <feDropShadow dx="-15" dy="0" stdDeviation="15" flood-color="#1a0d11" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    @keyframes curtainSlide {
      0% { transform: translateX(0); }
      15% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    @keyframes antigravity {
      0%, 100% { transform: translate(680px, 260px) scale(0.55); }
      50% { transform: translate(680px, 242px) scale(0.55); }
    }

    .curtain-panel {
      animation: curtainSlide 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      transform-origin: left center;
    }

    .logo-container {
      animation: antigravity 4.5s ease-in-out infinite;
      transform-origin: center center;
    }
  </style>

  <rect width="1920" height="1080" fill="#ffffff"/>

